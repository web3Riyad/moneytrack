# nginx.conf
# ----------
# Production web server configuration for MoneyTrack.
# Nginx serves the static files inside the Docker container.
#
# Key settings explained:
#   - gzip compression  → smaller files, faster load
#   - cache headers     → browser caches assets (faster repeat visits)
#   - security headers  → protects against common web attacks
#   - try_files         → makes single-page routing work correctly

server {
    listen       80;
    server_name  _;   # Accept any hostname (Docker / cloud handles the real domain)

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"          always;
    add_header X-Content-Type-Options   "nosniff"             always;
    add_header X-XSS-Protection         "1; mode=block"       always;
    add_header Referrer-Policy          "strict-origin"       always;
    add_header Permissions-Policy       "geolocation=(), camera=()" always;

    # ── Cache static assets (CSS, JS, fonts) ─────────────────
    # These files have content hashes in their names in later phases.
    location ~* \.(css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── Main route — serve index.html for all paths ──────────
    # Required for client-side routing in Phase 3 (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health check endpoint ────────────────────────────────
    # Used by Docker / cloud load balancers to know the app is alive.
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── Hide Nginx version from error pages ─────────────────
    server_tokens off;
}
