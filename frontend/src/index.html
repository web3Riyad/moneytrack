<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MoneyTrack – Personal daily expense and income tracker" />
    <meta name="theme-color" content="#0f1117" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
    <title>MoneyTrack</title>
  </head>

  <body>

    <!-- =============================================
         SCREEN 1: AUTH SCREEN
         Shown when user is NOT logged in.
         Hidden after login.
    ============================================= -->
    <div id="auth-screen" class="auth-screen" hidden>

      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">money<span class="logo__accent">track</span></div>
        <p class="auth-tagline">Track every taka. Know your money.</p>

        <!-- Tab toggle: Login / Register -->
        <div class="auth-tabs">
          <button class="auth-tab auth-tab--active" data-auth-tab="login">Sign in</button>
          <button class="auth-tab" data-auth-tab="register">Create account</button>
        </div>

        <!-- ── Login Form ── -->
        <div id="auth-panel-login" class="auth-panel">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <p class="auth-error" id="loginError" role="alert"></p>
          <button class="btn btn--primary btn--full" id="loginBtn">Sign in</button>

          <div class="auth-divider"><span>or</span></div>
          <button class="btn btn--google btn--full" id="googleLoginBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="" />
            Continue with Google
          </button>
        </div>

        <!-- ── Register Form ── -->
        <div id="auth-panel-register" class="auth-panel" hidden>
          <div class="form-group">
            <label class="form-label" for="registerName">Full name</label>
            <input type="text" id="registerName" class="form-input" placeholder="Your name" autocomplete="name" />
          </div>
          <div class="form-group">
            <label class="form-label" for="registerEmail">Email</label>
            <input type="email" id="registerEmail" class="form-input" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="form-label" for="registerPassword">Password</label>
            <input type="password" id="registerPassword" class="form-input" placeholder="Min. 6 characters" autocomplete="new-password" />
          </div>
          <p class="auth-error" id="registerError" role="alert"></p>
          <button class="btn btn--primary btn--full" id="registerBtn">Create account</button>

          <div class="auth-divider"><span>or</span></div>
          <button class="btn btn--google btn--full" id="googleRegisterBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="" />
            Continue with Google
          </button>
        </div>
      </div>
    </div>

    <!-- =============================================
         SCREEN 2: LOADING SCREEN
         Shown while Firebase checks auth state.
         Prevents flash of wrong screen.
    ============================================= -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-logo">money<span class="logo__accent">track</span></div>
      <div class="loading-spinner" aria-label="Loading..."></div>
    </div>

    <!-- =============================================
         SCREEN 3: APP SCREEN
         Shown when user IS logged in.
    ============================================= -->
    <div id="app-screen" hidden>

      <!-- Header -->
      <header class="header" role="banner">
        <div class="logo">money<span class="logo__accent">track</span></div>
        <div class="header-right">
          <time class="header__date" id="headerDate" aria-label="Today's date"></time>
          <button class="btn btn--icon btn--user" id="userMenuBtn" aria-label="User menu" aria-expanded="false">
            <span class="user-avatar" id="userAvatar">?</span>
          </button>
        </div>
      </header>

      <!-- User dropdown menu -->
      <div class="user-menu" id="userMenu" hidden role="menu">
        <div class="user-menu__info">
          <p class="user-menu__name" id="userDisplayName">—</p>
          <p class="user-menu__email" id="userEmail">—</p>
        </div>
        <hr class="user-menu__divider" />
        <button class="user-menu__item" id="signOutBtn" role="menuitem">Sign out</button>
      </div>

      <!-- Tab bar -->
      <nav class="tab-bar" role="navigation" aria-label="Main navigation">
        <button class="tab tab--active" data-tab="today" aria-selected="true" role="tab">Today</button>
        <button class="tab" data-tab="week" aria-selected="false" role="tab">Week</button>
        <button class="tab" data-tab="month" aria-selected="false" role="tab">Month</button>
      </nav>

      <!-- Main content -->
      <main id="main-content" role="main">

        <!-- TODAY TAB -->
        <section id="tab-today" class="tab-panel tab-panel--active" role="tabpanel" hidden>
          <div class="hero-card" aria-live="polite">
            <p class="hero-card__label">Total spent today</p>
            <p class="hero-card__amount">
              <span class="hero-card__currency" aria-hidden="true">৳</span>
              <span id="todayTotal">0</span>
            </p>
            <div class="hero-card__meta">
              <span class="hero-card__stat"><strong id="todayCount">0</strong> entries</span>
              <span class="hero-card__stat">Income: <strong id="todayIncome" class="text--income">৳0</strong></span>
              <span class="hero-card__stat">Net: <strong id="todayNet">৳0</strong></span>
            </div>
          </div>

          <!-- Add Entry Form -->
          <div class="card form-card">
            <h2 class="form-card__title">Add entry</h2>
            <div class="type-toggle" role="group" aria-label="Entry type">
              <button class="type-btn type-btn--expense type-btn--active" data-type="expense" aria-pressed="true">↑ Expense</button>
              <button class="type-btn type-btn--income" data-type="income" aria-pressed="false">↓ Income</button>
            </div>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label" for="entryName">Name</label>
                <input type="text" id="entryName" class="form-input" placeholder="e.g. Lunch, Rent..." maxlength="60" autocomplete="off" />
              </div>
              <div class="form-group">
                <label class="form-label" for="entrySource">Source</label>
                <select id="entrySource" class="form-input form-select">
                  <option value="Cash">Cash</option>
                  <option value="bKash">bKash</option>
                  <option value="Nagad">Nagad</option>
                  <option value="Bank">Bank</option>
                  <option value="Card">Card</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="entryAmount">Amount (৳)</label>
              <input type="number" id="entryAmount" class="form-input" placeholder="0.00" min="0.01" step="0.01" />
            </div>
            <p class="form-error" id="formError" role="alert" aria-live="assertive"></p>
            <button class="btn btn--primary btn--full" id="addEntryBtn">
              <span id="addEntryBtnText">Add Entry</span>
            </button>
          </div>

          <!-- Today's entries -->
          <div class="entries-section">
            <h2 class="entries-section__title">Today's entries</h2>
            <div id="todayEntries" aria-live="polite"></div>
          </div>
        </section>

        <!-- WEEK TAB -->
        <section id="tab-week" class="tab-panel" role="tabpanel" hidden>
          <div class="balance-row" id="weekBalance"></div>
          <div class="week-chart" id="weekGrid" role="img" aria-label="Weekly spending bar chart"></div>
          <h2 class="entries-section__title">All entries this week</h2>
          <div id="weekEntries" aria-live="polite"></div>
        </section>

        <!-- MONTH TAB -->
        <section id="tab-month" class="tab-panel" role="tabpanel" hidden>
          <div class="balance-row" id="monthBalance"></div>
          <h2 class="entries-section__title">Spending by source</h2>
          <div id="monthSources" aria-live="polite"></div>
          <h2 class="entries-section__title" style="margin-top:1.5rem">Daily breakdown</h2>
          <div id="monthDays" aria-live="polite"></div>
        </section>

      </main>
    </div><!-- /#app-screen -->

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- =============================================
         SCRIPTS
         Firebase SDK loaded from CDN (no build step needed).
         Order: firebase → config → utils → storage → ui → app
    ============================================= -->

    <!-- Firebase v10 SDK (modular, loaded as classic scripts via CDN compat layer) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- App scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

  </body>
</html>
